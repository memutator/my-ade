appId: com.mahas.app
productName: Mahas
directories:
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/**
  - package.json
  - '!node_modules/@homebridge/node-pty-prebuilt-multiarch/**'
asarUnpack:
  - resources/**
extraResources:
  - from: out/services
    to: services
    filter:
      - '**/*.mjs'
  - from: integrations/packs
    to: integrations/packs
    filter:
      - '**/*'
      - '!**/*.smoke.ts'
      - '!**/*.manual.ts'
      - '!**/*.test.mjs'
      - '!**/*.test.js'
      - '!**/*.test.ts'
      - '!**/README.md'
      - '!**/project.mjs'
      - '!**/__fixture__/**'
  - from: resources/pty-host.cjs
    to: pty-host.cjs
  - from: resources/webview-preload.cjs
    to: webview-preload.cjs
  - from: resources/agents
    to: agents
  # hook transports (mahas-hook.cjs, the opencode plugin pair) ship inside
  # integrations/packs/harness-runtime and are installed from there
  # pty-host runs under system Node outside the asar — ship node-pty where its
  # require('@homebridge/node-pty-prebuilt-multiarch') can resolve it.
  - from: node_modules/@homebridge/node-pty-prebuilt-multiarch
    to: node_modules/@homebridge/node-pty-prebuilt-multiarch
    filter:
      - '**/*'
      - '!prebuilds/linux-arm/**'
      - '!prebuilds/linux-arm64/**'
      - '!prebuilds/linux-ia32/**'
      - '!third_party/**'
      - '!typings/**'
      - '!scripts/**'
      - '!**/*.test.js'
      - '!binding.gyp'
win:
  executableName: mahas
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
  syncDesktopName: true
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
